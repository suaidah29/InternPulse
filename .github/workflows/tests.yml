name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style first: it finishes in seconds, so a formatting slip is reported before
  # anyone waits on two PHP versions of the suite.
  style:
    name: Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Pint itself needs json, mbstring, tokenizer and xml.
          extensions: mbstring, dom, json, tokenizer, xml
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-style-${{ hashFiles('composer.lock') }}
          restore-keys: composer-style-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # No -d/--dirty: the whole tree is checked, so nothing drifts back out of style.
      - name: Check formatting
        run: vendor/bin/pint --test --ansi

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor composer.json allows; 8.4 is what most hosts run now.
        php: ['8.3', '8.4']

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite is what the test suite uses (in-memory); the rest is what the
          # app itself needs, so a missing extension fails here and not in prod.
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, zip, gd, intl, bcmath, openssl
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # phpunit.xml sets sqlite :memory:, MAIL_MAILER=array and QUEUE_CONNECTION=sync,
      # so the suite needs no build step, no npm and no database service.
      - name: Run the test suite
        run: php artisan test --no-ansi
